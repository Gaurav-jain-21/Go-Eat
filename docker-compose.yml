services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
    ports:
      - "5173:80"
    depends_on:
      - api-gateway

  api-gateway:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_DIR: backend/api-gateway
    env_file: .env
    environment:
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      - auth-service
      - user-service
      - hotel-service
      - food-service
      - cart-service
      - order-service
      - payment-service
      - ai-service
      - notification-service
      - admin-service
      - review-rating-service
      - delivery-tracking-service
      - recommendation-service

  auth-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_DIR: backend/auth-service
    env_file: .env
    environment:
      PORT: 5001

  user-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_DIR: backend/user-service
    env_file: .env
    environment:
      PORT: 5002

  hotel-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_DIR: backend/hotel-service
    env_file: .env
    environment:
      PORT: 5003

  food-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_DIR: backend/food-service
    env_file: .env
    environment:
      PORT: 5004

  cart-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_DIR: backend/cart-service
    env_file: .env
    environment:
      PORT: 5005

  order-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_DIR: backend/order-service
    env_file: .env
    environment:
      PORT: 5006

  payment-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_DIR: backend/payment-service
    env_file: .env
    environment:
      PORT: 5007

  ai-service:
    build:
      context: ./backend/ai-service
    env_file: .env
    environment:
      PORT: 8000

  notification-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_DIR: backend/notification-service
    env_file: .env
    environment:
      PORT: 5009

  admin-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_DIR: backend/admin-service
    env_file: .env
    environment:
      PORT: 5010

  review-rating-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_DIR: backend/review-rating-service
    env_file: .env
    environment:
      PORT: 5011

  delivery-tracking-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_DIR: backend/delivery-tracking-service
    env_file: .env
    environment:
      PORT: 5012

  recommendation-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_DIR: backend/recommendation-service
    env_file: .env
    environment:
      PORT: 5013
